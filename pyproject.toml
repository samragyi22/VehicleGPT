[project]
name = "vehiclegpt"
version = "0.1.0"
description = "Offline on-device natural language assistant for vehicle telemetry and diagnostics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gradio>=4.0.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "huggingface_hub>=0.20.0",
    "pyarrow>=26.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]
llm = [
    "llama-cpp-python>=0.2.70",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sim", "ingest", "engine", "llm", "app", "eval"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["llm/grammar_test.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests that run the full simulator (deselect with -m 'not slow')",
]
